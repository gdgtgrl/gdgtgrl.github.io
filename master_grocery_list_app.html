<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Grocery List App</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for a cleaner mobile look, but allow scrolling */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24">
    
    <header class="glass-header sticky top-0 z-30 border-b border-slate-200 shadow-sm px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-500">
                Master Grocery List
            </h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">
        
        <div class="mb-6 bg-indigo-50/70 border border-indigo-100 rounded-xl p-4 shadow-sm">
            <p class="text-sm text-indigo-900/80 leading-relaxed font-medium">
                Interactive grocery planning tool for organizing a reusable master list and making shopping preparation easier.
            </p>
        </div>
        
        <!-- Loading Indicator / Error Message -->
        <div id="statusMessage" class="text-center py-8">
            <p class="text-slate-500 text-sm font-medium animate-pulse">Attempting to load master_grocery_list.csv...</p>
        </div>

        <div id="listContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
            <!-- Categories and checkboxes will populate here -->
        </div>
    </main>

    <div id="bottomBar" class="fixed bottom-0 left-0 right-0 p-4 glass-header border-t border-slate-200 z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transform translate-y-full transition-transform duration-300">
        <div class="max-w-5xl mx-auto flex gap-3">
            <button id="clearBtn" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400">
                Clear
            </button>
            <button id="downloadBtn" disabled class="flex-1 flex justify-center items-center gap-2 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Download .md</span>
                <span id="selectedBadge" class="hidden ml-1 bg-white text-indigo-700 py-0.5 px-2 rounded-full text-xs font-bold shadow-sm">0</span>
            </button>
        </div>
    </div>

    <script>
        let groceryData = [];

        const listContainer = document.getElementById('listContainer');
        const bottomBar = document.getElementById('bottomBar');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const selectedBadge = document.getElementById('selectedBadge');
        const statusMessage = document.getElementById('statusMessage');

        document.addEventListener('DOMContentLoaded', loadCSV);

        function loadCSV() {
            // Use PapaParse to fetch the file from the same directory
            Papa.parse('master_grocery_list.csv', {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.errors.length > 0 && results.data.length === 0) {
                        showError("Failed to load or parse 'master_grocery_list.csv'. Ensure the file is in the exact same folder as this HTML file.");
                        console.error("PapaParse errors:", results.errors);
                        return;
                    }
                    groceryData = results.data;
                    renderList();
                    statusMessage.classList.add('hidden');
                    listContainer.classList.remove('hidden');
                    bottomBar.classList.remove('translate-y-full'); // Show bottom bar
                },
                error: function(error) {
                    showError("Could not find 'master_grocery_list.csv'. Note: Most browsers block loading local files dynamically for security reasons (CORS). You may need to run this on a local web server.");
                    console.error("Fetch error:", error);
                }
            });
        }

        function showError(msg) {
            statusMessage.innerHTML = `
                <div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 text-sm text-left shadow-sm">
                    <p class="font-bold mb-1">Error Loading File</p>
                    <p>${msg}</p>
                </div>
            `;
            statusMessage.classList.remove('animate-pulse');
        }

        function renderList() {
            listContainer.innerHTML = '';
            const grouped = {};
            
            // Group items by their Category
            groceryData.forEach(row => {
                // Handle variations in column headers just in case
                const category = row.Category || row.category || 'Uncategorized';
                const item = row.Item || row.item || row.Name || row.name; 
                const note = row.Note || row.note || '';
                
                if (!item) return;

                if (!grouped[category]) grouped[category] = [];
                grouped[category].push({ name: item, note: note });
            });

            // Build the UI
            for (const [category, items] of Object.entries(grouped).sort()) {
                const catDiv = document.createElement('div');
                catDiv.className = 'bg-white p-3 rounded-2xl border border-slate-200 shadow-sm overflow-hidden';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex justify-between items-center mb-2 border-b border-indigo-50 pb-2';

                const title = document.createElement('h2');
                title.className = 'text-sm font-bold text-indigo-800 uppercase tracking-wider';
                title.textContent = category;

                const selectAllBtn = document.createElement('button');
                selectAllBtn.className = 'text-[11px] font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2 py-1 rounded-md transition-colors focus:outline-none active:bg-indigo-200';
                selectAllBtn.textContent = 'Select All';

                headerDiv.appendChild(title);
                headerDiv.appendChild(selectAllBtn);
                catDiv.appendChild(headerDiv);

                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'flex flex-col space-y-0.5';

                // Remove duplicates and sort items alphabetically
                const uniqueItemsMap = new Map();
                items.forEach(i => {
                    if(!uniqueItemsMap.has(i.name)) {
                        uniqueItemsMap.set(i.name, i.note);
                    }
                });
                
                const uniqueItemNames = Array.from(uniqueItemsMap.keys()).sort();

                uniqueItemNames.forEach(itemName => {
                    const note = uniqueItemsMap.get(itemName);
                    
                    const label = document.createElement('label');
                    // Super compact layout with large tap target for mobile
                    label.className = 'flex items-center space-x-3 py-2 px-1 -mx-1 rounded-lg hover:bg-slate-50 active:bg-slate-100 cursor-pointer transition-colors';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'item-checkbox w-5 h-5 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500 focus:ring-2 focus:ring-offset-1 transition duration-150 ease-in-out';
                    checkbox.value = itemName;
                    checkbox.dataset.note = note;

                    const spanWrapper = document.createElement('div');
                    spanWrapper.className = 'flex flex-col';

                    const span = document.createElement('span');
                    span.className = 'text-slate-700 text-sm font-medium select-none';
                    span.textContent = itemName;
                    spanWrapper.appendChild(span);

                    if (note) {
                        const noteSpan = document.createElement('span');
                        noteSpan.className = 'text-slate-400 text-xs italic mt-0.5';
                        noteSpan.textContent = note;
                        spanWrapper.appendChild(noteSpan);
                    }

                    label.appendChild(checkbox);
                    label.appendChild(spanWrapper);
                    itemWrapper.appendChild(label);
                });

                // Add Select All / Clear All functionality for this specific category
                selectAllBtn.addEventListener('click', () => {
                    const checkboxes = itemWrapper.querySelectorAll('.item-checkbox');
                    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                    
                    checkboxes.forEach(cb => cb.checked = !allChecked);
                    selectAllBtn.textContent = allChecked ? 'Select All' : 'Clear All';
                    
                    updateDownloadState();
                });

                // Update Select All button text if user manually changes checkboxes
                itemWrapper.addEventListener('change', () => {
                    const checkboxes = itemWrapper.querySelectorAll('.item-checkbox');
                    const allChecked = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
                    selectAllBtn.textContent = allChecked ? 'Clear All' : 'Select All';
                });

                catDiv.appendChild(itemWrapper);
                listContainer.appendChild(catDiv);
            }

            // Setup event delegation for checkboxes to update the download button state
            listContainer.addEventListener('change', updateDownloadState);
        }

        // Update the state of the sticky bottom bar
        function updateDownloadState() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
            const count = checkedBoxes.length;

            if (count > 0) {
                downloadBtn.removeAttribute('disabled');
                selectedBadge.textContent = count;
                selectedBadge.classList.remove('hidden');
                downloadBtn.classList.add('shadow-lg');
            } else {
                downloadBtn.setAttribute('disabled', 'true');
                selectedBadge.classList.add('hidden');
                downloadBtn.classList.remove('shadow-lg');
            }
        }

        // Clear all selections
        clearBtn.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            checkboxes.forEach(cb => {
                cb.checked = false;
                // Dispatch change event to trigger the section-level "Clear All" buttons to reset
                cb.dispatchEvent(new Event('change', { bubbles: true })); 
            });
            updateDownloadState();
        });

        // Handle Markdown Generation and Download
        downloadBtn.addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            if (checkboxes.length === 0) return; // Failsafe

            let markdownContent = '# Grocery List\n\n';
            
            const categoryContainers = document.querySelectorAll('#listContainer > div');
            
            categoryContainers.forEach(container => {
                const checkedItems = container.querySelectorAll('.item-checkbox:checked');
                
                if (checkedItems.length > 0) {
                    const categoryName = container.querySelector('h2').textContent;
                    markdownContent += `## ${categoryName}\n`;
                    
                    checkedItems.forEach(cb => {
                        const note = cb.dataset.note;
                        if (note) {
                            markdownContent += `- [ ] ${cb.value} *(${note})*\n`;
                        } else {
                            markdownContent += `- [ ] ${cb.value}\n`;
                        }
                    });
                    
                    markdownContent += '\n'; 
                }
            });

            // Accurate timezone date handling
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];

            const blob = new Blob([markdownContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            a.download = `Grocery_List_${localISOTime}.md`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>

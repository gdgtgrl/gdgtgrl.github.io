        // DOM Elements
        const listContainer = document.getElementById('listContainer');
        const bottomBar = document.getElementById('bottomBar');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const selectedBadge = document.getElementById('selectedBadge');

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderList();
            bottomBar.classList.remove('translate-y-full');
        });

        // Render the Checkboxes Grouped by Category
        function renderList() {
            listContainer.innerHTML = '';
            const grouped = {};
            
            // Group items by their Category
            groceryData.forEach(row => {
                const category = row.Category || row.category || 'Uncategorized';
                const item = row.Item || row.item || row.Name || row.name; 
                
                if (!item) return;

                if (!grouped[category]) grouped[category] = [];
                grouped[category].push(item);
            });

            // Build the UI
            for (const [category, items] of Object.entries(grouped).sort()) {
                const catDiv = document.createElement('div');
                catDiv.className = 'bg-white p-3 rounded-2xl border border-slate-200 shadow-sm overflow-hidden';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex justify-between items-center mb-2 border-b border-indigo-50 pb-2';

                const title = document.createElement('h2');
                title.className = 'text-sm font-bold text-indigo-800 uppercase tracking-wider';
                title.textContent = category;

                const selectAllBtn = document.createElement('button');
                selectAllBtn.className = 'text-[11px] font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2 py-1 rounded-md transition-colors focus:outline-none active:bg-indigo-200';
                selectAllBtn.textContent = 'Select All';

                headerDiv.appendChild(title);
                headerDiv.appendChild(selectAllBtn);
                catDiv.appendChild(headerDiv);

                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'flex flex-col space-y-0.5';

                // Remove duplicates and sort items alphabetically
                const uniqueItems = [...new Set(items)].sort();

                uniqueItems.forEach(item => {
                    const label = document.createElement('label');
                    // Super compact layout with large tap target for mobile
                    label.className = 'flex items-center space-x-3 py-2 px-1 -mx-1 rounded-lg hover:bg-slate-50 active:bg-slate-100 cursor-pointer transition-colors';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'item-checkbox w-5 h-5 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500 focus:ring-2 focus:ring-offset-1 transition duration-150 ease-in-out';
                    checkbox.value = item;

                    const span = document.createElement('span');
                    span.className = 'text-slate-700 text-sm font-medium select-none';
                    span.textContent = item;

                    label.appendChild(checkbox);
                    label.appendChild(span);
                    itemWrapper.appendChild(label);
                });

                // Add Select All / Clear All functionality for this specific category
                selectAllBtn.addEventListener('click', () => {
                    const checkboxes = itemWrapper.querySelectorAll('.item-checkbox');
                    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                    
                    checkboxes.forEach(cb => cb.checked = !allChecked);
                    selectAllBtn.textContent = allChecked ? 'Select All' : 'Clear All';
                    
                    updateDownloadState();
                });

                // Update Select All button text if user manually changes checkboxes
                itemWrapper.addEventListener('change', () => {
                    const checkboxes = itemWrapper.querySelectorAll('.item-checkbox');
                    const allChecked = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
                    selectAllBtn.textContent = allChecked ? 'Clear All' : 'Select All';
                });

                catDiv.appendChild(itemWrapper);
                listContainer.appendChild(catDiv);
            }

            // Setup event delegation for checkboxes to update the download button state
            listContainer.addEventListener('change', updateDownloadState);
        }

        // Update the state of the sticky bottom bar
        function updateDownloadState() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
            const count = checkedBoxes.length;

            if (count > 0) {
                downloadBtn.removeAttribute('disabled');
                selectedBadge.textContent = count;
                selectedBadge.classList.remove('hidden');
                downloadBtn.classList.add('shadow-lg');
            } else {
                downloadBtn.setAttribute('disabled', 'true');
                selectedBadge.classList.add('hidden');
                downloadBtn.classList.remove('shadow-lg');
            }
        }

        // Clear all selections
        clearBtn.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            checkboxes.forEach(cb => {
                cb.checked = false;
                // Dispatch change event to trigger the section-level "Clear All" buttons to reset
                cb.dispatchEvent(new Event('change', { bubbles: true })); 
            });
            updateDownloadState();
        });

        // Handle Markdown Generation and Download
        downloadBtn.addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            if (checkboxes.length === 0) return; // Failsafe

            let markdownContent = '# Grocery List\n\n';
            
            const categoryContainers = document.querySelectorAll('#listContainer > div');
            
            categoryContainers.forEach(container => {
                const checkedItems = container.querySelectorAll('.item-checkbox:checked');
                
                if (checkedItems.length > 0) {
                    const categoryName = container.querySelector('h2').textContent;
                    markdownContent += `## ${categoryName}\n`;
                    
                    checkedItems.forEach(cb => {
                        markdownContent += `- [ ] ${cb.value}\n`;
                    });
                    
                    markdownContent += '\n'; 
                }
            });

            // Accurate timezone date handling
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];

            const blob = new Blob([markdownContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            a.download = `Grocery_List_${localISOTime}.md`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
